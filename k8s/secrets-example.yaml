apiVersion: v1
kind: Secret
metadata:
  name: canieat-secrets
type: Opaque
stringData:
  POSTGRES_USER: "canieat"
  POSTGRES_PASSWORD: "replace-with-a-strong-password"
  POSTGRES_DB: "CanIEat"
  DATABASE_URL: "postgresql+asyncpg://canieat:replace-with-a-strong-password@postgres:5432/CanIEat"
  JWT_SECRET_KEY: "replace-with-a-long-random-secret"
  OPENROUTER_API_KEY: "replace-with-your-api-key"
  MFDS_FOOD_API_SERVICE_KEY: "replace-with-your-mfds-food-api-service-key"