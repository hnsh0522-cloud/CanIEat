apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  labels:
    {{- include "canieat.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        {{- include "canieat.labels" . | nindent 8 }}
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: JWT_SECRET_KEY
            - name: REFRESH_TOKEN_COOKIE_SECURE
              value: {{ .Values.backend.refreshTokenCookieSecure | quote }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: OPENROUTER_API_KEY
            - name: MFDS_FOOD_API_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: MFDS_FOOD_API_SERVICE_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi
  labels:
    {{- include "canieat.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: fastapi
  ports:
    - port: 8000
      targetPort: 8000
